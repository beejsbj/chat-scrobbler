name: Release

# Push a v* tag to publish. Tags with a suffix (v0.5.0-rc1) become pre-releases,
# which install.sh's releases/latest URL skips.
on:
  push:
    tags: ["v*"]

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run release "$GITHUB_REF_NAME" --build-only
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error

  # Each cross-compiled binary runs on its own OS and architecture before publish.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release/
      - run: scripts/smoke-binary.sh dist/release/chat-scrobbler-${{ matrix.target }}

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/release/
      - run: bun run release "$GITHUB_REF_NAME" --publish-only
        env:
          GH_TOKEN: ${{ github.token }}
