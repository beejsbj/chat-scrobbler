# Intended for Coolify on bjslab. MCP_AUTH_TOKEN and INGEST_TOKEN come from
# Coolify env. After first boot run:
# docker compose exec ollama ollama pull nomic-embed-text

services:
  scrobbler:
    build: .
    restart: unless-stopped
    # No host ports are published. Coolify Traefik reaches this service over
    # its proxy network.
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      INGEST_TOKEN: ${INGEST_TOKEN}
      MCP_HTTP_PORT: "4321"
      PORT: "4318"
      CHAT_SCROBBLER_EMBED_PROVIDER: ollama
      CHAT_SCROBBLER_EMBED_MODEL: nomic-embed-text
      OLLAMA_BASE_URL: http://ollama:11434
      BIND_HOST: 0.0.0.0
    volumes:
      - /mnt/server-ssd/chat-scrobbler:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # bjslab is shared and already short on memory. Uncapped, this sidecar
    # overloaded the host in August (BJS-359). Embeddings are queued, not urgent.
    cpus: 1
    mem_limit: 1200m
    memswap_limit: 1200m
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - /mnt/server-ssd/ollama:/root/.ollama
