# Intended for Coolify on bjslab. MCP_AUTH_TOKEN and INGEST_TOKEN come from
# Coolify env. The embedder sidecar always runs and its image carries the model,
# so there is no pull step after first boot.

# DATA_UID and DATA_GID (default 999) must match the owner of the data directory.
# Both images and the embedder's `user:` take them from here, so they cannot drift.

services:
  scrobbler:
    build:
      context: .
      args:
        DATA_UID: ${DATA_UID:-999}
        DATA_GID: ${DATA_GID:-999}
    restart: unless-stopped
    # No host ports are published. Coolify Traefik reaches this service over
    # its proxy network.
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      INGEST_TOKEN: ${INGEST_TOKEN}
      MCP_HTTP_PORT: "4321"
      PORT: "4318"
      CHAT_SCROBBLER_EMBED_PROVIDER: ${CHAT_SCROBBLER_EMBED_PROVIDER:-embeddinggemma}
      CHAT_SCROBBLER_EMBED_MODEL: ${CHAT_SCROBBLER_EMBED_MODEL:-litert-community/embeddinggemma-2-740m-litert-lm}
      CHAT_SCROBBLER_EMBED_BACKFILL_ENABLED: "${CHAT_SCROBBLER_EMBED_BACKFILL_ENABLED:-true}"
      CHAT_SCROBBLER_EMBED_BACKFILL_INTERVAL_MS: "${CHAT_SCROBBLER_EMBED_BACKFILL_INTERVAL_MS:-600000}"
      CHAT_SCROBBLER_EMBED_BACKFILL_BATCH_SIZE: "${CHAT_SCROBBLER_EMBED_BACKFILL_BATCH_SIZE:-25}"
      CHAT_SCROBBLER_EMBED_SKIPPED_RETRY_MS: "${CHAT_SCROBBLER_EMBED_SKIPPED_RETRY_MS:-86400000}"
      CHAT_SCROBBLER_EMBED_CHUNK_CHARS: "${CHAT_SCROBBLER_EMBED_CHUNK_CHARS:-}"
      CHAT_SCROBBLER_EMBED_MAX_CHUNKS: "${CHAT_SCROBBLER_EMBED_MAX_CHUNKS:-16}"
      CHAT_SCROBBLER_EMBED_BASE_URL: ${CHAT_SCROBBLER_EMBED_BASE_URL:-http://embedder:4320}
      CHAT_SCROBBLER_MONITOR_STALE_DAYS_CHATGPT: "${CHAT_SCROBBLER_MONITOR_STALE_DAYS_CHATGPT:-7}"
      CHAT_SCROBBLER_MONITOR_STALE_DAYS_CLAUDE: "${CHAT_SCROBBLER_MONITOR_STALE_DAYS_CLAUDE:-14}"
      CHAT_SCROBBLER_MONITOR_STALE_DAYS_GEMINI: "${CHAT_SCROBBLER_MONITOR_STALE_DAYS_GEMINI:-21}"
      BIND_HOST: 0.0.0.0
    volumes:
      - /mnt/server-ssd/chat-scrobbler:/data
    networks:
      - default
      - embeddings
    depends_on:
      # Start order only. Not required, so docker-compose.no-embedder.yml can leave the sidecar out.
      embedder:
        condition: service_started
        required: false

  embedder:
    # Same uid:gid as the scrobbler, which writes asset blobs 0600. The asset
    # mount below stays read-only.
    user: "${DATA_UID:-999}:${DATA_GID:-999}"
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
      args:
        DATA_UID: ${DATA_UID:-999}
        DATA_GID: ${DATA_GID:-999}
    init: true
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 300s
    networks:
      - embeddings
    # No ports or proxy network. Only the scrobbler can reach this network.
    environment:
      EMBEDDER_NETWORK_MODE: private-docker
      EMBEDDER_PORT: "4320"
      EMBEDDER_IDLE_SECONDS: "300"
      EMBEDDER_ALLOWED_ROOTS: /data/canonical/assets
      EMBEDDER_CACHE_DIR: /var/cache/embedder
    volumes:
      - embedder-cache-v2:/var/cache/embedder
      - type: bind
        source: /mnt/server-ssd/chat-scrobbler/canonical/assets
        target: /data/canonical/assets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:4320/health',timeout=3)); assert r['status']=='ok' and r['model_available'] and r['model']=='litert-community/embeddinggemma-2-740m-litert-lm'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  embeddings:
    internal: true

volumes:
  # v2: the first volume was created with a different owner. A new name is created from
  # the image with the right owner (the old volume can be removed after deploy).
  embedder-cache-v2:
