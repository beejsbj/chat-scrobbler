# Intended for Coolify on bjslab. MCP_AUTH_TOKEN and INGEST_TOKEN come from
# Coolify env. After first boot run:
# docker compose exec ollama ollama pull nomic-embed-text

services:
  scrobbler:
    build: .
    restart: unless-stopped
    # No host ports are published. Coolify Traefik reaches this service over
    # its proxy network.
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      INGEST_TOKEN: ${INGEST_TOKEN}
      MCP_HTTP_PORT: "4321"
      PORT: "4318"
      CHAT_SCROBBLER_EMBED_PROVIDER: ${CHAT_SCROBBLER_EMBED_PROVIDER:-ollama}
      CHAT_SCROBBLER_EMBED_MODEL: ${CHAT_SCROBBLER_EMBED_MODEL:-nomic-embed-text}
      CHAT_SCROBBLER_EMBED_BACKFILL_ENABLED: "${CHAT_SCROBBLER_EMBED_BACKFILL_ENABLED:-true}"
      CHAT_SCROBBLER_EMBED_BACKFILL_INTERVAL_MS: "${CHAT_SCROBBLER_EMBED_BACKFILL_INTERVAL_MS:-600000}"
      CHAT_SCROBBLER_EMBED_BACKFILL_BATCH_SIZE: "${CHAT_SCROBBLER_EMBED_BACKFILL_BATCH_SIZE:-25}"
      CHAT_SCROBBLER_EMBED_BASE_URL: http://embedder:4320
      CHAT_SCROBBLER_MONITOR_STALE_DAYS_CHATGPT: "${CHAT_SCROBBLER_MONITOR_STALE_DAYS_CHATGPT:-7}"
      CHAT_SCROBBLER_MONITOR_STALE_DAYS_CLAUDE: "${CHAT_SCROBBLER_MONITOR_STALE_DAYS_CLAUDE:-14}"
      CHAT_SCROBBLER_MONITOR_STALE_DAYS_GEMINI: "${CHAT_SCROBBLER_MONITOR_STALE_DAYS_GEMINI:-21}"
      OLLAMA_BASE_URL: http://ollama:11434
      BIND_HOST: 0.0.0.0
    volumes:
      - /mnt/server-ssd/chat-scrobbler:/data
    networks:
      - default
      - embeddings
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # bjslab is shared and already short on memory. Uncapped, this sidecar
    # overloaded the host in August (BJS-359). Embeddings are queued, not urgent.
    cpus: 1
    mem_limit: 1200m
    memswap_limit: 1200m
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - /mnt/server-ssd/ollama:/root/.ollama

  # Explicit opt-in: COMPOSE_PROFILES=embeddings (Coolify must pass it to Compose).
  # Enabling this sidecar does not change scrobbler's production Ollama provider.
  embedder:
    profiles: [embeddings]
    user: "1001:1001"
    build:
      context: .
      dockerfile: services/embedder/Dockerfile
    init: true
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 300s
    networks:
      - embeddings
    # No ports or proxy network. Only the scrobbler can reach this network.
    environment:
      EMBEDDER_NETWORK_MODE: private-docker
      EMBEDDER_PORT: "4320"
      EMBEDDER_IDLE_SECONDS: "300"
      EMBEDDER_ALLOWED_ROOTS: /data/canonical/assets
      EMBEDDER_CACHE_DIR: /var/cache/embedder
    volumes:
      - embedder-cache:/var/cache/embedder
      - type: bind
        source: /mnt/server-ssd/chat-scrobbler/canonical/assets
        target: /data/canonical/assets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:4320/health',timeout=3)); assert r['status']=='ok' and r['model_available'] and r['model']=='litert-community/embeddinggemma-2-740m-litert-lm'"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  embeddings:
    internal: true

volumes:
  embedder-cache:
